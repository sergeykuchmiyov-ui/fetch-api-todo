<!DOCTYPE html>
<html lang="uk">
   <head>
      <meta charset="UTF-8">
      <title> «Список справ» (To-Do List)</title>
      <link rel ="stylesheet" href="style.css">
   </head>
   <body>
      <header>
         <h1>Список справ</h1>
      </header>

      <main>

         <p id="loading" hidden>Завантаження...</p>
         <p id="errorMessage" hidden></p>

         <p id="taskCounter">Усього: 0 | Активні: 0 | Виконані: 0</p>

         <input type="text" id="taskInput" placeholder="Нова задача...">
         <button id="addTask">Додати задачу</button>

         <ul id="taskList"></ul>
      </main>

      <footer>
         
      </footer>

      <script src="script.js"></script>

   </body>
   </html>
